{% extends "base.html" %}
{% block title %}Page not found — {{ company_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="wrap center" style="max-width:560px">
    <p class="eyebrow">404</p>
    <h1>That page has driven off</h1>
    <p class="lede" style="margin:0 auto 30px">

    <a class="btn btn--primary btn--lg" href="{{ url_for('public.fleet') }}">Browse the fleet</a>
  </div>
</section>
{% endblock %}
