<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ company_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ company_tagline }} Hire a car in Berlin with clear all-in pricing and no hidden charges.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% include "partials/header.html" %}

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flashes">
      {% for category, message in messages %}
        <div class="flash flash--{{ 'error' if category == 'error' else 'success' }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<main>
  {% block content %}{% endblock %}
</main>

{% include "partials/footer.html" %}
</body>
</html>
