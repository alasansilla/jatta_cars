{% extends 'base.html' %}
{% block head %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">{% endblock %}
{% block content %}<section class="section"><div class="wrap"><h1>Your ride</h1><p>Reference: {{ booking.reference }}</p><p>{{ booking.pickup_address }} → {{ booking.dropoff_address }}</p><h2 id="status">Waiting for driver acceptance</h2><p id="driver"></p><p id="location-note"></p><div id="track-map" style="height:340px"></div><button class="btn" id="cancel">Cancel ride</button><p id="error" role="status"></p></div></section>{% endblock %}
{% block scripts %}<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const cfg={{ map_settings|tojson }},ref={{ booking.reference|tojson }},csrf={{ csrf_token|tojson }};
let marker=null;const map=typeof L!=='undefined'?L.map('track-map').setView(cfg.centre,cfg.zoom):null;if(map)L.tileLayer(cfg.tile_url,{attribution:cfg.attribution}).addTo(map);
const labels={pending:'Waiting for driver acceptance',confirmed:'Driver accepted',arriving:'Driver is coming to your pickup',in_progress:'Trip in progress',completed:'Trip completed',cancelled:'Trip cancelled'};
async function refresh(){try{const response=await fetch('/ride/status/'+ref);if(!response.ok)throw Error();const d=await response.json();document.getElementById('status').textContent=labels[d.status]||d.status;document.getElementById('driver').textContent=d.driver?d.driver.name+' · '+(d.driver.vehicle||'')+' · '+(d.driver.phone||''):'';document.getElementById('cancel').hidden=!['pending','confirmed','arriving'].includes(d.status);if(marker&&map){map.removeLayer(marker);marker=null;}if(d.driver&&d.driver.lat!==undefined&&d.driver.lat!==null&&map){marker=L.marker([d.driver.lat,d.driver.lng]).addTo(map);map.setView([d.driver.lat,d.driver.lng],15);document.getElementById('location-note').textContent='Last driver update: '+new Date(d.driver.updated_at).toLocaleTimeString();}else document.getElementById('location-note').textContent=d.driver?'Waiting for a fresh driver location.':'';if(['completed','cancelled'].includes(d.status))clearInterval(poll);}catch(e){document.getElementById('error').textContent='Connection interrupted. Reconnecting…';}}
document.getElementById('cancel').onclick=async()=>{const r=await fetch('/ride/cancel/'+ref,{method:'POST',headers:{'X-CSRF-Token':csrf}});const d=await r.json();if(d.error)document.getElementById('error').textContent=d.error;refresh();};const poll=setInterval(refresh,5000);refresh();
</script>{% endblock %}
