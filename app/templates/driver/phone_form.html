{# Expects: intent, country_code, number. #}
<form method="post" action="{{ url_for('driver_auth.send_code') }}" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="intent" value="{{ intent }}">
  <label class="big-label" for="phone">Your phone number</label>
  <div class="phone-input">
    <input id="country_code" name="country_code" type="tel" inputmode="tel"
           autocomplete="tel-country-code" value="{{ country_code }}" maxlength="5"
           aria-label="Country code" required>
    <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national"
           value="{{ number }}" maxlength="20" placeholder="770 1234" required autofocus>
  </div>
  <p class="hint">+220 is The Gambia. Change it if your number is from another country.</p>
  <button class="btn btn--primary btn--xl" type="submit">Send me a code</button>
  <p class="hint center" style="margin-top:12px">We will text you a 6-digit code. You don't need a password.</p>
</form>
