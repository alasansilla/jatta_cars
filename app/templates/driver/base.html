{% extends "base.html" %}
{% block title %}{% block driver_title %}Driver sign in{% endblock %} — {{ company_name }}{% endblock %}
{% block content %}
<section class="section section--tight">
  <div class="wrap">
    <div class="panel driver-card">
      {% if error %}<p class="notice notice--error" role="alert">{{ error }}</p>{% endif %}
      {% block driver_content %}{% endblock %}
    </div>
    {% block driver_after %}{% endblock %}
  </div>
</section>
{% endblock %}
