{# Shown on public pages only when a staff member is signed in. #}
<div class="editbar" id="editbar" data-csrf="{{ csrf_token }}">
  <div class="editbar__inner">
    <span class="editbar__brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
      <span class="editbar__who">Editing as {{ session.get('admin_username') }}</span>
    </span>

    {% if not site.site_live %}
      <a class="editbar__draft" href="{{ url_for('admin.checklist') }}"
         title="Only you can see this. Click to publish.">Draft — not public</a>
    {% endif %}

    <span class="editbar__status" id="edit-status"></span>

    <span class="editbar__actions">
      <button type="button" class="btn btn--sm btn--ghost" id="edit-toggle">Edit this page</button>
      <button type="button" class="btn btn--sm btn--primary" id="edit-save" hidden>Save changes</button>
      <button type="button" class="btn btn--sm btn--ghost" id="edit-cancel" hidden>Discard</button>
      <a class="btn btn--sm btn--ghost editbar__secondary" href="{{ url_for('admin.dashboard') }}">Dashboard</a>
      <a class="btn btn--sm btn--ghost editbar__secondary" href="{{ url_for('admin.logout') }}">Sign out</a>
    </span>
  </div>
</div>

<input type="file" id="edit-file" accept="image/*" hidden>
