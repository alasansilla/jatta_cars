<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ url_for('public.index') }}">
      <svg class="brand__mark" viewBox="0 0 64 44" fill="none" aria-hidden="true">
        <path d="M6 32V25c0-3 2-5 5-6l7-2 5-7c1-2 3-3 5-3h14c2 0 4 1 5 3l5 7 7 2c3 1 5 3 5 6v7c0 2-1 3-3 3h-4a6 6 0 0 0-12 0H25a6 6 0 0 0-12 0H9c-2 0-3-1-3-3Z" fill="#ff4d30"/>
        <circle cx="19" cy="35" r="6" fill="#ff4d30"/>
        <circle cx="45" cy="35" r="6" fill="#ff4d30"/>
        <path d="M44 12a10 10 0 0 1 8 4M47 6a17 17 0 0 1 13 7" stroke="#ff4d30" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="brand__text">
        <span class="brand__name" data-edit="brand_name">{{ site.brand_name }}</span>
        <span class="brand__sub" data-edit="brand_sub">{{ site.brand_sub }}</span>
      </span>
    </a>

    {% if minimal %}{# holding page: nothing to navigate to yet #}{% else %}
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-burger" aria-label="Show menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </label>

    <nav class="nav">
      {% set here = request.endpoint %}
      <a href="{{ url_for('public.index') }}" class="{{ 'is-active' if here == 'public.index' }}">Home</a>
      <a href="{{ url_for('public.fleet') }}" class="{{ 'is-active' if here in ['public.fleet', 'public.vehicle_detail'] }}">Our fleet</a>
      <a href="{{ url_for('public.about') }}" class="{{ 'is-active' if here == 'public.about' }}">About</a>
      <a href="{{ url_for('public.contact') }}" class="{{ 'is-active' if here == 'public.contact' }}">Contact</a>
      <a href="{{ url_for('public.booking_lookup') }}" class="{{ 'is-active' if here in ['public.booking_lookup', 'public.booking_detail'] }}">My booking</a>
      <a class="btn btn--primary" href="{{ url_for('public.fleet') }}">Book a car</a>
    </nav>
    {% endif %}
  </div>
</header>
